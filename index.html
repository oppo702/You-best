<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الكشافة - ثانوية الأمير عبد المجيد بن عبد العزيز</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 600px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            border-top: 6px solid #1e5631;
        }

        .header {
            background-color: #1e5631;
            color: #ffffff;
            padding: 25px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 0.95rem;
            opacity: 0.9;
        }

        form {
            padding: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #2c3e50;
            font-size: 0.9rem;
        }

        input[type="text"],
        input[type="tel"],
        select,
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.95rem;
            transition: border-color 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #1e5631;
            box-shadow: 0 0 5px rgba(30, 86, 49, 0.3);
        }

        .btn-submit {
            width: 100%;
            background-color: #1e5631;
            color: white;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #143d22;
        }

        .success-message {
            display: none;
            background-color: #d4edda;
            color: #155724;
            padding: 15px;
            margin: 20px 25px;
            border-radius: 6px;
            text-align: center;
            border: 1px solid #c3e6cb;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>الفرقة الكشفية</h1>
        <p>ثانوية الأمير عبد المجيد بن عبد العزيز (بنين)</p>
    </div>

    <div id="successMessage" class="success-message">
        تم استلام طلب الانضمام بنجاح! سيتم التواصل معك قريباً.
    </div>

    <form id="scoutForm" onsubmit="handleSubmit(event)">
        <div class="form-group">
            <label for="fullName">اسم الطالب الثلاثي *</label>
            <input type="text" id="fullName" required placeholder="أدخل اسمك الكامل">
        </div>

        <div class="form-group">
            <label for="nationalId">رقم الهوية الوطنية / الإقامة *</label>
            <input type="text" id="nationalId" required maxlength="10" placeholder="أدخل 10 أرقام">
        </div>

        <div class="form-group">
            <label for="grade">الصف الدراسي *</label>
            <select id="grade" required>
                <option value="">اختر الصف...</option>
                <option value="السنة الأولى مشتركة">السنة الأولى مشتركة</option>
                <option value="الصف الثاني ثانوي">الصف الثاني ثانوي</option>
                <option value="الصف الثالث ثانوي">الصف الثالث ثانوي</option>
            </select>
        </div>

        <div class="form-group">
            <label for="phone">رقم جوال الطالب *</label>
            <input type="tel" id="phone" required placeholder="05xxxxxxxx">
        </div>

        <div class="form-group">
            <label for="parentPhone">رقم جوال ولي الأمر *</label>
            <input type="tel" id="parentPhone" required placeholder="05xxxxxxxx">
        </div>

        <div class="form-group">
            <label for="skills">المهارات أو الهوايات (اختياري)</label>
            <textarea id="skills" rows="3" placeholder="مثل: الإلقاء، تنظيم الفعاليات، الإسعافات الأولية، الرسم..."></textarea>
        </div>

        <button type="submit" class="btn-submit">إرسال طلب الانضمام</button>
    </form>
</div>

<script>
    function handleSubmit(event) {
        event.preventDefault();
        
        // إخفاء النموذج وإظهار رسالة النجاح
        document.getElementById('scoutForm').style.display = 'none';
        document.getElementById('successMessage').style.display = 'block';
    }
</script>

</body>
</html>
